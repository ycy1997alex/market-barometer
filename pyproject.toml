[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "barometer"
version = "0.1.0"
description = "market-barometer — 世界／台灣總經與台美大盤 ETF 的本機資料管線"
requires-python = ">=3.13"
dependencies = [
    "yfinance>=1.2.0",
    "pandas>=2.2",
    "numpy>=2.0",
    "requests>=2.32",
    "cryptography>=42.0",
]

[project.optional-dependencies]
tw = ["shioaji>=1.3.2"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
